services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment: {RABBITMQ_DEFAULT_USER: app, RABBITMQ_DEFAULT_PASS: app}
    ports: ["15672:15672"]
    volumes: [rabbit:/var/lib/rabbitmq]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"], interval: 5s, retries: 20}
    restart: unless-stopped


  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes: [redis:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20}
    restart: unless-stopped

  gateway:
    build: .
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    restart: unless-stopped

    depends_on: &deps
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: python -m worker.main
    env_file: .env
    volumes: [jobdata:/data]
    deploy: {replicas: 2}
    restart: unless-stopped
    depends_on: *deps

volumes: {rabbit: {}, redis: {}, jobdata: {}}
